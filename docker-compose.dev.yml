version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pos-postgres-dev
    environment:
      POSTGRES_DB: pos_restaurant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - pos-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:

networks:
  pos-network-dev:
    driver: bridge
